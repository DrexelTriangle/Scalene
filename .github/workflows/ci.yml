name: CI

# dev is the staging branch dev.thetriangle.org serves. It gets the same checks,
# but deploy-production.yml gates on head_branch == main, so a green dev run
# never reaches production.
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded CI runs for the same branch or PR so stale runs don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate and build
    # GitHub-hosted runner only. Pull requests (including from forks) must never
    # execute on the self-hosted production runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Detect which optional validation scripts are actually defined in
      # package.json. Steps below run only when their script exists, so no
      # non-existent npm script is ever invoked and no failure is hidden.
      - name: Detect available scripts
        id: scripts
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { scripts = {} } = JSON.parse(readFileSync('package.json', 'utf8'));
          const has = (name) => Object.prototype.hasOwnProperty.call(scripts, name);
          const flags = {
            lint: has('lint'),
            typecheck: has('typecheck'),
            check: has('check'),
            test: has('test'),
            format: has('format:check'),
          };
          const lines = Object.entries(flags).map(([k, v]) => `${k}=${v}`);
          appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          for (const line of lines) console.log(line);
          EOF

      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint

      - name: Type check
        if: steps.scripts.outputs.typecheck == 'true'
        run: npm run typecheck

      - name: Astro check
        if: steps.scripts.outputs.check == 'true'
        run: npm run check

      - name: Test
        if: steps.scripts.outputs.test == 'true'
        run: npm test

      - name: Formatting check
        if: steps.scripts.outputs.format == 'true'
        run: npm run format:check

      # Always run the build; this is the one validation script that exists today.
      - name: Build
        run: npm run build

      # The service worker is generated by an explicit hook in astro.config.mjs
      # rather than by vite-plugin-pwa's own (which Astro's SSR builds skip). If
      # that wiring breaks the build still succeeds, and /sw.js silently 404s in
      # production -- which is exactly how it broke before.
      - name: Check service worker build output
        run: node scripts/check-service-worker.mjs

  e2e:
    name: Smoke tests (Playwright)
    # Same rule as above: GitHub-hosted only, never the production runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # CMS_API_BASE_URL / MEDIA_BASE_URL are inlined at build time, so this is a
      # separate build pointed at e2e/stub-cms.mjs (recorded fixtures). It never
      # talks to the real CMS.
      - name: Build against the stub CMS
        run: npm run test:e2e:build

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
